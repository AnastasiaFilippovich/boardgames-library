<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Библиотека настолок</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Библиотека настолок</h1>
            <section class="search">
                <label for="search-field">Поиск</label>
                <input type="search" class="search__field" id="search-field" placeholder="Каркассон">
                <ul class="search-tags">
                    <li>
                        <button class="tag" type="button" data-tag="fun">Весёлая</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="chaotic">Хаотичная</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="competitive">Соревновательная</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="magic">Магическая</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="calm">Спокойная</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="cooperative">Командная</button>
                    </li>
                    <li>
                        <button class="tag" type="button" data-tag="strategic">Стратегическая</button>
                    </li>
                </ul>
                <button class="search-reset" type="button">Сбросить фильтры</button>
            </section>
            <section class="games">
                <template id="game-card-template">
                    <li class="game-card">
                        <h2 class="game-card__title"></h2>
                        <ul class="game-card__tags"></ul>
                        <span class="game-card__players"></span>
                        <span class="game-card__rating"></span>
                        <button class="game-card__more">Подробнее</button>
                    </li>
                </template>
                <ul class="games-list">
                    <span class="empty-search">Таких игр нет... Пока что</span>
                </ul>
                <button class="games-add-new" type="button">+ Добавить игру</button>
            </section>
        </main>
        <div class="modal-new">
            <div class="modal-new__content">
                <button class="modal-new__close-button" type="button">Закрыть</button>
                <h2 class="modal-new__title">Добавить новую игру</h2>
                <form class="modal-form">
                    <div class="modal-form__field">
                        <label for="game-name">Название игры</label>
                        <input class="modal-form__name" type="text" id="game-name" name="game-name" placeholder="Манчкин" required>
                    </div>
                    <ul class="modal-form__tags">
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="fun">
                                Весёлая
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="chaotic">
                                Хаотичная
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="competitive">
                                Соревновательная
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="magic">
                                Магическая
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="calm">
                                Спокойная
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="cooperative">
                                Командная
                            </label>
                        </li>
                        <li class="modal-tag">
                            <label>
                                <input class="modal-tag__input" type="checkbox" name="tags" value="strategic">
                                Стратегическая
                            </label>
                        </li>
                    </ul>
                    <div class="modal-form__field">
                        <label for="game-players">Количество игроков</label>
                        <input class="modal-form__players" type="text" id="game-players" name="game-players" placeholder="2-4" required>
                    </div>
                    <div class="modal-form__field">
                        <label for="game-time">Время игры</label>
                        <input class="modal-form__players" type="text" id="game-time" name="game-time" placeholder="от 30 минут" required>
                    </div>
                    <div class="modal-form__field">
                        <label for="game-description">Описание игры (необязательно)</label>
                        <textarea class="modal-form__description" id="game-description" name="game-description" placeholder="Опиши игру своими словами"></textarea>
                    </div>
                    <button class="modal-form__submit" type="submit">Добавить игру</button>
                </form>
            </div>
        </div>
        <div class="modal-game-card">
            <div class="modal-game-card__content">
                <button class="modal-game-card__close-button" type="button">Закрыть</button>
                <h2 class="modal-game-card__title"></h2>
                <ul class="modal-game-card__tags"></ul>
                <span class="modal-game-card__players"></span>
                <span class="modal-game-card__time"></span>
                <span class="modal-game-card__rating"></span>
                <p class="modal-game-card__description"></p>
                <div class="modal-game-card__tabs">
                    <button class="modal-game-card__tab-button tab-button--active" type="button" data-button="rating">Оценки</button>
                    <button class="modal-game-card__tab-button" type="button" data-button="notes">Заметки</button>
                    <template id="rating-element-template">
                        <li class="rating-list__element">
                            <span class="element__date"></span>
                            <span class="element__author"></span>
                            <span class="element__rating"></span>
                            <p class="element__comment"></p>
                        </li>
                    </template>
                    <template id="notes-element-template">
                        <li class="notes-list__element">
                            <span class="element__date"></span>
                            <span class="element__author"></span>
                            <p class="element__comment"></p>
                        </li>
                    </template>
                    <div class="modal-game-card__tab tab--active" data-tab="rating">
                        <ul class="tab__rating-list"></ul>
                    </div>
                    <div class="modal-game-card__tab" data-tab="notes">
                        <ul class="tab__notes-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
